<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — VeloTech</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="VeloTech" class="logo-img">
  </div>
  <div class="search">
    <input type="text" placeholder="Search products...">
    <button>Search</button>
  </div>
  <div class="icons">
    <span>❤️</span>
    <span id="cartIcon">🛒<span class="cart-count" id="cartCount">0</span></span>
    <span>👤</span>
  </div>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="index.html#deals">Deals</a>
  <a href="index.html#electronics">Electronics</a>
  <a href="index.html#laptops">Laptops</a>
  <a href="phones.html">Phones</a>
  <a href="index.html#accessories">Accessories</a>
</nav>

<section class="auth-wrap">

  <div class="auth-card" id="authCard">

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Sign In</button>
      <button class="auth-tab" data-tab="signup">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="loginForm">
      <h1>Welcome Back 👋</h1>
      <p class="auth-sub">Sign in to continue to checkout</p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>

      <button type="submit" class="auth-btn">Sign In →</button>

      <p class="auth-switch">
        Don't have an account?
        <a href="#" data-switch="signup">Create one</a>
      </p>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="signupForm">
      <h1>Create Account 🚀</h1>
      <p class="auth-sub">Join VeloTech in seconds</p>

      <div class="field">
        <label>Full Name</label>
        <input type="text" id="signupName" required>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="signupPassword" required minlength="6">
        <small class="field-hint">At least 6 characters</small>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" required minlength="6">
      </div>

      <label class="terms-check">
        <input type="checkbox" id="agreeTerms" required>
        <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
      </label>

      <button type="submit" class="auth-btn">Create Account →</button>

      <p class="auth-switch">
        Already have an account?
        <a href="#" data-switch="login">Sign in</a>
      </p>
    </form>

  </div>

</section>

<script src="auth.js"></script>

</body>
</html>
